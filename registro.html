<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar entrada | CineMax Perú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/registro.css">
    <script src="https://kit.fontawesome.com/065ba884c8.js" crossorigin="anonymous"></script>
</head>

<body data-publica="true">

    <header class="site-header">
        <div class="contenedor barra">
            <a href="index.html" class="logo">Cine<span>Max</span> Perú</a>

            <input type="checkbox" id="menu-toggle" class="menu-toggle-input">
            <label for="menu-toggle" class="menu-toggle-boton" aria-label="Abrir menú de navegación">
                <span></span>
                <span></span>
                <span></span>
            </label>

            <nav class="nav-principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="cartelera.html">Cartelera</a></li>
                    <li><a href="como-funciona.html">Cómo funciona</a></li>
                    <li><a href="registro.html" class="activo">Reservar</a></li>
                    <li><a href="ubicacion.html">Ubicación</a></li>
                </ul>
            </nav>

            <div class="nav-cuenta" id="nav-cuenta"></div>
        </div>
    </header>

    <main>

        <section id="reservar" class="seccion">
            <div class="contenedor">
                <h2>Reserva tu entrada</h2>
                <p class="subtitulo">Completa tus datos y elige la función que deseas</p>

                <p class="sesion-activa-aviso" id="sesion-activa">
                    <i class="fa-solid fa-circle-user"></i> Cargando datos de tu cuenta...
                </p>

                <form class="formulario-reserva" action="#" method="post" novalidate>

                    <div class="campo">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
                    </div>

                    <div class="campo">
                        <label for="pelicula">Película</label>
                        <select id="pelicula" name="pelicula" required>
                            <option value="">Cargando películas…</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="horario">Horario de función</label>
                        <select id="horario" name="horario" required>
                            <option value="">Selecciona un horario</option>
                            <option value="tarde">Tarde (1:00 pm – 5:30 pm)</option>
                            <option value="noche">Noche (6:00 pm – 9:45 pm)</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="entradas">Cantidad de entradas</label>
                        <input type="number" id="entradas" name="entradas" min="1" max="8" value="1" required>
                    </div>

                    <div class="campo campo-ancho">
                        <label for="comentario">Comentario u observación (opcional)</label>
                        <textarea id="comentario" name="comentario" rows="3" placeholder="Ej. asientos juntos, acceso para silla de ruedas, etc."></textarea>
                    </div>

                    <p class="mensaje-error mensaje-error-formulario" id="reserva-error" role="alert"></p>
                    <button type="submit" class="boton boton-primario">Confirmar reserva</button>

                </form>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="contenedor">
            <p>&copy; 2026 CineMax Perú. Todos los derechos reservados.</p>
            <p class="footer-nota">LIMA HUAROC JEANPIERRE EDUARDO </p>
        </div>
    </footer>
    <script type="module" src="js/registro/registro.js"></script>
</body>

</html>
