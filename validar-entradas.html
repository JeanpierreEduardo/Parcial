<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Validación de entradas | CineMax Empleado</title>
    <link rel="stylesheet" href="css/validar-entradas.css">
    <link rel="stylesheet" href="css/mejoras.css">
</head>

<body>
    <header class="site-header nav-administrativa">
        <div class="contenedor barra"><a href="venta-entradas.html" class="logo">Cine<span>Max</span> <small>Taquilla</small></a>
            <nav class="nav-principal" aria-label="Empleado">
                <ul></ul>
            </nav>
            <div id="nav-cuenta" class="nav-cuenta"></div>
        </div>
    </header>
    <main class="admin-main">
        <div class="contenedor">
            <div class="admin-cabecera">
                <div>
                    <p class="etiqueta">Área del empleado</p>
                    <h1>Validación de entradas</h1>
                    <p>Busca el código de la compra y confirma el ingreso. Cada compra se valida una sola vez.</p>
                </div>
            </div>
            <p id="mensaje" class="mensaje" role="status" aria-live="polite">Verificando sesión…</p>
            <section id="contenido-empleado" hidden>
                <form id="form-validacion" class="filtros">
                    <label>Código de entrada
                        <input name="codigo" placeholder="CIN-…" required maxlength="32" autocomplete="off">
                    </label>
                    <button type="submit" class="boton boton-primario">Buscar entrada</button>
                </form>
                <div id="entrada" class="ticket" hidden></div>
                <button id="validar" class="boton boton-primario" type="button" hidden>Confirmar ingreso de todas las entradas</button>
            </section>
        </div>
    </main>
    <footer class="site-footer">
        <div class="contenedor">© 2026 CineMax Perú · Jeanpierre Eduardo Lima Huaroc</div>
    </footer>
    <script type="module" src="js/validar-entradas/validar-entradas.js"></script>
</body>

</html>
