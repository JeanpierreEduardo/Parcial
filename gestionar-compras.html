<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de compras | CineMax Perú</title>
    <link rel="stylesheet" href="css/gestionar-compras.css">
    <link rel="stylesheet" href="css/mejoras.css">
</head>

<body>
    <header class="site-header">
        <div class="contenedor barra"><a href="index.html" class="logo">Cine<span>Max</span> Perú</a>
            <nav class="nav-principal">
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="cartelera.html">Cartelera</a></li>
                    <li><a href="registro.html">Comprar entrada</a></li>
                    <li><a href="consulta.html">Mis compras</a></li>
                </ul>
            </nav>
            <div id="nav-cuenta" class="nav-cuenta"></div>
        </div>
    </header>
    <main class="seccion">
        <div class="contenedor">
            <h1>Gestión de compras</h1>
            <p id="perfil-panel"></p>
            <p id="mensaje" class="mensaje" role="status">Cargando...</p>
            <section id="gestion" hidden>
                <h2 id="titulo-form">Crear compra</h2>
                <form id="form-compra" class="gestion-form">
                    <label>Cliente
                        <select name="id_usuario" required></select>
                    </label>
                    <label>Película
                        <select name="pelicula" required>
                            <option value="">Cargando películas…</option>
                        </select>
                    </label>
                    <label>Horario
                        <select name="horario" required>
                            <option value="tarde">Tarde</option>
                            <option value="noche">Noche</option>
                        </select>
                    </label>
                    <label>Cantidad de entradas
                        <input name="cantidad" type="number" min="1" max="8" value="1" required>
                    </label>
                    <label>Comentario
                        <textarea name="comentario" maxlength="500"></textarea>
                    </label>
                    <label>Estado
                        <select name="estado">
                            <option value="registrado">Registrado</option>
                            <option value="atendido">Atendido</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </label>
                    <div class="acciones">
                        <button class="boton boton-primario" type="submit">Guardar</button>
                        <button class="boton" type="button" id="cancelar">Nueva compra</button>
                    </div>
                </form>
                <h2>Compras de todos los clientes</h2>
                <div id="lista-reservas"></div>
            </section>
        </div>
    </main>
    <footer class="site-footer">
        <div class="contenedor">© 2026 CineMax Perú · Jeanpierre Eduardo Lima Huaroc</div>
    </footer>
    <script type="module" src="js/gestionar-compras/gestionar-compras.js"></script>
</body>

</html>
